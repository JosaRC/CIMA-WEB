# ==============================================================================
# NETLIFY CONFIGURATION - CIMA MONTACARGAS AGUASCALIENTES
# Optimizado para despliegues continuos desde Git y Single Page Application (SPA)
# ==============================================================================

[build]
  publish = "dist"
  command = "npm run build"

# Redirección SPA estándar: Enruta todas las solicitudes a index.html (código 200)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ==============================================================================
# HEADERS DE SEGURIDAD, PRIVACIDAD Y RENDIMIENTO
# ==============================================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

# Caché inmutable y duradera para assets versionados por Vite (hash único)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Documento HTML principal sin caché estancada para reflejar cambios inmediatos
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Archivos de medios estáticos
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
